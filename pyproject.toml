[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abb-training"
version = "0.1.0"
requires-python = ">=3.11"
description = "ABB workflow training local tools"

[project.scripts]
abb = "training_runtime.launcher:entrypoint"

[tool.setuptools]
packages = ["training_runtime"]

[tool.setuptools.package-data]
training_runtime = ["*.json", "*.toml"]

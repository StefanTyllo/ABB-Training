name: Validate workflow training labs
'on':
  workflow_dispatch: {}
  push:
    paths:
    - training_kit/**
    - training_ci/**
    - training_author/**
    - Dockerfile
    - compose*.yaml
    - docker/**
    - tests/container/**
    - .github/workflows/validate-workflow-labs.yml
    - .github/workflows/build-training-image.yml
    branches:
    - training/workflow-labs
permissions:
  contents: read
jobs:
  image:
    uses: ./.github/workflows/build-training-image.yml
  lab:
    needs:
    - image
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lab:
        - fw1
        - fw2
        - hw1
        - hw2
        - t1
        - t2
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: training-runtime
    - name: Load and verify immutable image
      run: |
        sha256sum -c training-image.tar.sha256
        docker load --input training-image.tar
        test "$(docker image inspect ${{ needs.image.outputs.image_id }} --format '{{.Id}}')" = "${{ needs.image.outputs.image_id }}"
        docker volume create "abb-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lab }}"
        echo "ABB_CI_VOLUME=abb-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lab }}" >> "$GITHUB_ENV"
    - name: Rehearse four stages and fresh transfers with Copilot
      env:
        COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT }}
      run: |
        test -n "$COPILOT_GITHUB_TOKEN" || { echo '::error::COPILOT secret missing'; exit 1; }
        umask 077
        mkdir -p "$RUNNER_TEMP/abb-auth"
        chmod 700 "$RUNNER_TEMP/abb-auth"
        printf '%s' "$COPILOT_GITHUB_TOKEN" > "$RUNNER_TEMP/abb-auth/copilot-token"
        # The private host directory protects the readable, provider-only bind-mounted file.
        chmod 444 "$RUNNER_TEMP/abb-auth/copilot-token"
        docker run --rm --init --security-opt seccomp=docker/seccomp.json --shm-size=1g -v "$ABB_CI_VOLUME:/workspace/runs" --mount "type=bind,src=$RUNNER_TEMP/abb-auth/copilot-token,dst=/run/secrets/copilot_token,readonly" -e ABB_IMAGE_ID="${{ needs.image.outputs.image_id }}" "${{ needs.image.outputs.image_id }}" python /opt/abb/runtime/ci.py --provider copilot -- python /opt/abb/repo/training_ci/run_lab.py "${{ matrix.lab }}"
    - name: Independent credential-free grading
      if: always()
      run: |
        docker run --rm --init --network none --security-opt seccomp=docker/seccomp.json --shm-size=1g -v "$ABB_CI_VOLUME:/workspace/runs" -e ABB_IMAGE_ID="${{ needs.image.outputs.image_id }}" "${{ needs.image.outputs.image_id }}" python /opt/abb/repo/training_ci/grade_all.py "${{ matrix.lab }}"
    - name: Extract runtime evidence
      if: always()
      run: |
        docker run --name abb-evidence --network none -v "$ABB_CI_VOLUME:/workspace/runs" "${{ needs.image.outputs.image_id }}" true
        docker cp abb-evidence:/workspace/runs/. runs/
        docker rm abb-evidence
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lab-${{ matrix.lab }}-${{ github.run_attempt }}
        path: runs/${{ matrix.lab }}/
        retention-days: 14
        if-no-files-found: error
    - name: Publish assessment summary
      if: always()
      run: |
        if [ -f "runs/${{ matrix.lab }}/assessment.md" ]; then cat "runs/${{ matrix.lab }}/assessment.md" >> "$GITHUB_STEP_SUMMARY"; fi
    - name: Clean disposable runtime state
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/abb-auth/copilot-token"
        if [ -n "${ABB_CI_VOLUME:-}" ]; then docker volume rm "$ABB_CI_VOLUME"; fi

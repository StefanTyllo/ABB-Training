name: Copilot authentication test
'on':
  workflow_dispatch: {}
  push:
    paths:
    - training_ci/**
    - training_author/**
    - Dockerfile
    - compose*.yaml
    - docker/**
    - tests/container/**
    - .github/workflows/copilot-smoke-test.yml
    - .github/workflows/build-training-image.yml
permissions:
  contents: read
jobs:
  image:
    uses: ./.github/workflows/build-training-image.yml
  copilot:
    needs:
    - image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: training-runtime
    - name: Load and verify immutable image
      run: |
        sha256sum -c training-image.tar.sha256
        docker load --input training-image.tar
        test "$(docker image inspect ${{ needs.image.outputs.image_id }} --format '{{.Id}}')" = "${{ needs.image.outputs.image_id }}"
        docker volume create "abb-${{ github.run_id }}-${{ github.run_attempt }}-copilot-smoke-test"
        echo "ABB_CI_VOLUME=abb-${{ github.run_id }}-${{ github.run_attempt }}-copilot-smoke-test" >> "$GITHUB_ENV"
    - name: Test Copilot authentication and execution
      env:
        COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT }}
      run: |
        test -n "$COPILOT_GITHUB_TOKEN" || { echo '::error::COPILOT secret missing'; exit 1; }
        umask 077
        mkdir -p "$RUNNER_TEMP/abb-auth"
        chmod 700 "$RUNNER_TEMP/abb-auth"
        printf '%s' "$COPILOT_GITHUB_TOKEN" > "$RUNNER_TEMP/abb-auth/copilot-token"
        # The private host directory protects the readable, provider-only bind-mounted file.
        chmod 444 "$RUNNER_TEMP/abb-auth/copilot-token"
        docker run --rm --init --security-opt seccomp=docker/seccomp.json --shm-size=1g -v "$ABB_CI_VOLUME:/workspace/runs" --mount "type=bind,src=$RUNNER_TEMP/abb-auth/copilot-token,dst=/run/secrets/copilot_token,readonly" -e ABB_IMAGE_ID="${{ needs.image.outputs.image_id }}" "${{ needs.image.outputs.image_id }}" python /opt/abb/runtime/ci.py --provider copilot -- sh -c "copilot --version; copilot -p 'Reply with exactly: Copilot authentication successful' --no-ask-user -s --available-tools='' > /workspace/runs/copilot-response.txt"
    - name: Extract runtime evidence
      if: always()
      run: |
        docker run --name abb-evidence --network none -v "$ABB_CI_VOLUME:/workspace/runs" "${{ needs.image.outputs.image_id }}" python /opt/abb/runtime/collect.py
        docker cp abb-evidence:/tmp/abb-evidence/. runs/
        docker rm abb-evidence
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: copilot-response
        path: runs/copilot-response.txt
        retention-days: 14
        if-no-files-found: error
    - name: Publish assessment summary
      if: always()
      run: |
        if [ -f "runs/copilot-response.txt" ]; then cat "runs/copilot-response.txt" >> "$GITHUB_STEP_SUMMARY"; fi
    - name: Clean disposable runtime state
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/abb-auth/copilot-token"
        if [ -n "${ABB_CI_VOLUME:-}" ]; then docker volume rm "$ABB_CI_VOLUME"; fi

name: Validate complete T1 package
on:
  push:
    branches: ['training/workflow-labs']
    paths:
      - 'validation_t1_package/**'
      - '.github/workflows/check-t1-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r validation_t1_package/seed/requirements.txt
      - name: Check complete generated package without an AI token
        run: python validation_t1_package/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-complete-package
          path: runs/t1-refined/
          retention-days: 14

name: Validate complete T1 package
'on':
  workflow_dispatch: {}
  push:
    paths:
    - validation_t1_package/**
    - training_ci/**
    - training_author/**
    - Dockerfile
    - compose*.yaml
    - docker/**
    - tests/container/**
    - .github/workflows/check-t1-package.yml
    - .github/workflows/build-training-image.yml
    branches:
    - training/workflow-labs
permissions:
  contents: read
jobs:
  image:
    uses: ./.github/workflows/build-training-image.yml
  package:
    needs:
    - image
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: training-runtime
    - name: Load and verify immutable image
      run: |
        sha256sum -c training-image.tar.sha256
        docker load --input training-image.tar
        test "$(docker image inspect ${{ needs.image.outputs.image_id }} --format '{{.Id}}')" = "${{ needs.image.outputs.image_id }}"
        docker volume create "abb-${{ github.run_id }}-${{ github.run_attempt }}-check-t1-package"
        echo "ABB_CI_VOLUME=abb-${{ github.run_id }}-${{ github.run_attempt }}-check-t1-package" >> "$GITHUB_ENV"
    - name: Independent credential-free grading
      run: |
        docker run --rm --init --network none --security-opt seccomp=docker/seccomp.json --shm-size=1g -v "$ABB_CI_VOLUME:/workspace/runs" -e ABB_IMAGE_ID="${{ needs.image.outputs.image_id }}" "${{ needs.image.outputs.image_id }}" python /opt/abb/repo/validation_t1_package/check.py
    - name: Extract runtime evidence
      if: always()
      run: |
        docker run --name abb-evidence --network none -v "$ABB_CI_VOLUME:/workspace/runs" "${{ needs.image.outputs.image_id }}" python /opt/abb/runtime/collect.py
        docker cp abb-evidence:/tmp/abb-evidence/. runs/
        docker rm abb-evidence
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: t1-complete-package
        path: runs/
        retention-days: 14
        if-no-files-found: error
    - name: Clean disposable runtime state
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/abb-auth/copilot-token"
        if [ -n "${ABB_CI_VOLUME:-}" ]; then docker volume rm "$ABB_CI_VOLUME"; fi

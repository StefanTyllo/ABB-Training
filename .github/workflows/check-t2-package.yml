name: Validate unchanged T2 package
on:
  push:
    branches: ['training/workflow-labs']
    paths:
      - 'validation_t2_package/**'
      - '.github/workflows/check-t2-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r validation_t2_package/seed/requirements.txt
      - name: Regrade unchanged generated package without an AI token
        run: python validation_t2_package/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-complete-package
          path: runs/t2-regraded/
          retention-days: 14
